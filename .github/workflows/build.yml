name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Build Installer (40HXInstaller.exe)
        run: |
          cd windows-v3.0/tools/inst40hx
          go build -ldflags "-s -w -H=windowsgui" -o "../../release/40HXInstaller.exe" .

      - name: Build Diagnostic (40HXCheck.exe)
        run: |
          cd windows-v3.0/tools/check40x
          go build -ldflags "-s -w -H=windowsgui" -o "../../release/40HXCheck.exe" .

      - name: Build Uninstaller (40HXUninstaller.exe)
        run: |
          cd windows-v3.0/tools/uninstall40x
          go build -ldflags "-s -w -H=windowsgui" -o "../../release/40HXUninstaller.exe" .

      - name: Build UnlockRiotGame (UnlockRiotGame.exe)
        run: |
          cd windows-v3.0/tools/unlockriot
          go build -ldflags "-s -w -H=windowsgui" -o "../../release/UnlockRiotGame.exe" .

      - name: Upload Release Binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: windows-v3.0/release/*.exe
