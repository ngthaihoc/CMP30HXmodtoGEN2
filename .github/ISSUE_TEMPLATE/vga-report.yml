name: Báo cáo chẩn đoán VGA (dự phòng thủ công)
description: Gửi báo cáo JSON từ Collect_VGA_Report.bat khi máy không gửi trực tiếp được qua endpoint.
title: "[VGA Report] "
labels:
  - vga-report
body:
  - type: markdown
    attributes:
      value: |
        ### Lưu ý trước khi gửi
        - Biểu mẫu này là phương án dự phòng khi `Collect_VGA_Report.bat` không kết nối được với máy chủ tiếp nhận.
        - **Issue GitHub là công khai.** Hãy kiểm tra lại nội dung JSON trước khi bấm gửi để chắc chắn không có đường dẫn cá nhân, địa chỉ IP/MAC hoặc số serial.
        - Chỉ dán nội dung tệp `.json` do `Collect_VGA_Report.bat` tạo ra. Không dán tệp nhị phân hoặc ảnh chụp có thông tin riêng tư.
  - type: textarea
    id: report
    attributes:
      label: Nội dung JSON báo cáo VGA
      description: Dán toàn bộ nội dung tệp JSON đã tạo bởi Collect_VGA_Report.bat (đã được chép sẵn vào clipboard nếu chọn mở biểu mẫu dự phòng).
      placeholder: |
        {
          "schema_version": 1,
          ...
        }
      render: json
    validations:
      required: true
  - type: textarea
    id: hardware_context
    attributes:
      label: "Hồ sơ phần cứng & thử nghiệm bổ sung (tùy chọn — theo modding-data-plan §7 & §9)"
      description: Cung cấp thêm thông tin vật lý mà phần mềm không tự đọc được để hỗ trợ tái lập và đối chứng. Không ghi serial, đường dẫn cá nhân hoặc thông tin riêng tư.
      placeholder: |
        - Card/SKU thực tế & PCB revision / mã chip VRAM (che serial nếu đính kèm ảnh):
        - Khe trên mainboard & Riser (cắm trực tiếp / model + chiều dài riser):
        - PSU & cách cấp nguồn phụ cho card (1 dây / 2 dây riêng, đầu 6/8-pin):
        - Can thiệp đã thử (strap / flash VBIOS / EFI / mod driver) & phiên bản hoặc SHA-256:
        - Mục tiêu thử nghiệm (TDP / PCIe Gen Speed / ReBAR / CUDA / Tensor / VRAM / ổn định):
        - Giả thuyết về nguồn giới hạn & dữ liệu còn thiếu cần đo thêm:
        - Kết quả sau thay đổi / sau reboot / sau sleep-wake / sau khôi phục (rollback):
    validations:
      required: false
  - type: checkboxes
    id: consent
    attributes:
      label: Xác nhận đồng ý công khai dữ liệu kỹ thuật
      description: Đánh dấu để xác nhận bạn đã xem trước báo cáo và đồng ý đăng công khai lên repository.
      options:
        - label: Tôi đồng ý công khai dữ liệu phần cứng trong báo cáo này và đã kiểm tra không chứa thông tin cá nhân (PII).
          required: true
