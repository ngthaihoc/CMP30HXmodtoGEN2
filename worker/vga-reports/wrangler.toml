name = "cmp-vga-reports"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
TARGET_REPO = "ngthaihoc/CMP30HXmodtoGEN2"
INTAKE_ENABLED = "true"
DAILY_CAP = "200"
IP_LIMIT = "10"

[[kv_namespaces]]
binding = "REPORTS"
id = "1aabca66b188444f988a57e65cadc69c"

# Bí mật cần nạp bằng `pnpm dlx wrangler secret put`:
# - GITHUB_APP_ID
# - GITHUB_APP_INSTALLATION_ID
# - GITHUB_APP_PRIVATE_KEY (định dạng PKCS#8 PEM)
# - IP_SALT
# - SIGNING_KEYS (JSON, ví dụ: {"k1":"<base64 32 byte>"})
